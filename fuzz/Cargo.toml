[package]
name = "oxideav-pict-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
oxideav-pict = { path = ".." }
# The `demux` target drives the registry container; the published core.
oxideav-core = "0.1"

# Prevent this from interfering with workspaces.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "probe"
path = "fuzz_targets/probe.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_roundtrip"
path = "fuzz_targets/encode_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quicktime_8200"
path = "fuzz_targets/quicktime_8200.rs"
test = false
doc = false
bench = false

# `demux` drives the `pict` container through the registry: the
# structural probe (version stanza + opcode walk, with and without an
# extension hint), the demuxer, the registry decoder on the packet and
# the muxer on the demuxed packet.
[[bin]]
name = "demux"
path = "fuzz_targets/demux.rs"
test = false
doc = false
bench = false
